<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Mistral</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      background: #f6f6f8;
      color: #1c1c1e;
    }
    main { width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 1rem; border-bottom: 1px solid #e2e2e6; font-weight: 600; }
    #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .msg { max-width: 80%; padding: 0.6rem 0.9rem; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #ff8f0d; color: #fff; }
    .assistant { align-self: flex-start; background: #e9e9ee; }
    .error { align-self: flex-start; background: #f8d7da; color: #842029; }
    form { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid #e2e2e6; }
    input {
      flex: 1; padding: 0.7rem 0.9rem; border: 1px solid #d0d0d6; border-radius: 10px; font-size: 1rem;
    }
    button {
      padding: 0.7rem 1.2rem; border: none; border-radius: 10px; background: #ff8f0d; color: #fff;
      font-size: 1rem; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    @media (prefers-color-scheme: dark) {
      body { background: #17171a; color: #f0f0f2; }
      header, form { border-color: #2c2c31; }
      .assistant { background: #2c2c31; }
      input { background: #222226; color: inherit; border-color: #3a3a40; }
    }
  </style>
</head>
<body>
  <main>
    <header>Chat Mistral — mistral-small-latest</header>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Écrivez votre message…" autocomplete="off" required />
      <button id="send" type="submit">Envoyer</button>
    </form>
  </main>
  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = role === 'user' ? 'msg user' : 'msg assistant';
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      send.disabled = true;
      addMessage('user', text);
      history.push({ role: 'user', content: text });
      const pending = addMessage('assistant', '…');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
        pending.textContent = data.reply;
        history.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        pending.className = 'msg error';
        pending.textContent = 'Erreur : ' + err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
